services:
  redis:
    ports:
      - '${REDIS_PORT}:6379'

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rnc-rediscommander
    restart: always
    platform: linux/amd64
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rnc-net
