services:
  redis:
    image: redis:7.4-alpine
    container_name: rnc-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT}:6379'
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      #start_period: 30s
    volumes:
      - redis-data:/data
    networks:
      - rnc-net

  redis-commander:
    image: rediscommander/redis-commander:latest
    platform: linux/amd64
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rnc-net

volumes:
  redis-data:
    driver: local

networks:
  rnc-net:
    driver: bridge
