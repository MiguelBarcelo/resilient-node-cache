services:
  redis:
    image: redis:7.4-alpine
    container_name: rnc-redis
    restart: unless-stopped
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
      #start_period: 30s
    volumes:
      - redis-data:/data
    networks:
      - rnc-net

volumes:
  redis-data:
    driver: local

networks:
  rnc-net:
    driver: bridge
